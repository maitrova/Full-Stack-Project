# Production Configuration for narifighter.online
global:
  domain: narifighter.online
  environment: production

# Backend Configuration
backend:
  enabled: true
  name: backend
  replicaCount: 1
  
  image:
    repository: maitrova/crud-backend
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  
  env:
    NODE_ENV: production
    PORT: "5000"
  
  envSecrets:
    JWT_SECRET: "maitrova"  # Change this in production!
    MONGOOSE_PASSWORD: "Saigollapalli@122"
  # MONGOOSE_URL: "mongodb://maitrova:Saigollapalli%40122@mongodb:27017/appdb?authSource=admin"
    MONGOOSE_URL: "mongodb+srv://hemanthnagala876_db_user:VRYnuUeDAbgNzdpp@cluster0.ru99jrx.mongodb.net/"
    API_URL: "https://narifighter.online/api"
    
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 1Gi
  
  livenessProbe:
    enabled: false
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    enabled: false
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: narifighter.online
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: narifighter-tls
        hosts:
          - narifighter.online
  
  imagesIngress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
    hosts:
      - host: narifighter.online
        paths:
          - path: /images(/|$)(.*)
            pathType: ImplementationSpecific
    tls:
      - secretName: narifighter-images-tls
        hosts:
          - narifighter.online

# Frontend Configuration
frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  
  image:
    repository: maitrova/crud-frontend
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  env:
    NGINX_PORT: "80"
  
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 512Mi
  
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: narifighter.online
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: narifighter-tls
        hosts:
          - narifighter.online

# MongoDB Configuration
mongodb:
  enabled: true
  name: mongodb
  replicaCount: 1
  
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 27017
    targetPort: 27017
  
  env:
    MONGO_INITDB_DATABASE: crud-app
  
  persistence:
    enabled: false
  
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi
  
  livenessProbe:
    enabled: true
    exec:
      command:
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    exec:
      command:
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
    initialDelaySeconds: 10
    periodSeconds: 5

# Ingress Configuration (Legacy - Disabled, using separate ingresses per service)
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  
  hosts:
    - host: narifighter.online
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 5000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  
  tls:
    - secretName: narifighter-tls
      hosts:
        - narifighter.online
