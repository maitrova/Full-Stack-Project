# Production Configuration for narifighter.online
global:
  domain: narifighter.online
  environment: production

# Backend Configuration
backend:
  enabled: true
  name: backend
  replicaCount: 1
  
  image:
    repository: maitrova/crud-backend
    tag: v1.0.0
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  
  env:
    NODE_ENV: production
    PORT: "5000"
  
  envSecrets:
    MONGODB_URI: "mongodb://mongodb-service:27017/crud-app"
  
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 1Gi
  
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
  
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Frontend Configuration
frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  
  image:
    repository: maitrova/crud-frontend
    tag: v1.0.0
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  env:
    NGINX_PORT: "80"
  
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 512Mi
  
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 15
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# MongoDB Configuration
mongodb:
  enabled: true
  name: mongodb
  replicaCount: 1
  
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 27017
    targetPort: 27017
  
  env:
    MONGO_INITDB_DATABASE: crud-app
  
  persistence:
    enabled: false
  
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi
  
  livenessProbe:
    enabled: true
    exec:
      command:
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    enabled: true
    exec:
      command:
        - mongosh
        - --eval
        - "db.adminCommand('ping')"
    initialDelaySeconds: 10
    periodSeconds: 5

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  
  hosts:
    - host: narifighter.online
      paths:
        - path: /api(/|$)(.*)
          pathType: ImplementationSpecific
          service: backend
          port: 5000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
  
  tls:
    - secretName: narifighter-tls
      hosts:
        - narifighter.online
