name: Weekly MongoDB Backup

on:
  schedule:
    # Every Sunday at 1:00 AM UTC
    - cron: '0 1 * * 0'

  workflow_dispatch:

jobs:
  mongo_backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.RCLONE_CONFIG }}' > ~/.config/rclone/rclone.conf

      - name: Create MongoDB Backup from Kubernetes Pod
        id: backup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            export KUBECONFIG=/home/sai/.kube/config

            BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
            BACKUP_NAME="mongo_backup_${BACKUP_DATE}.tar.gz"

            POD_NAME="mongodb-0"

            echo "Using Mongo pod: $POD_NAME"

            echo "Running mongodump..."
            kubectl exec -n production $POD_NAME -- \
              mongodump --out /tmp/mongo_data

            echo "Creating archive..."
            kubectl exec -n production $POD_NAME -- \
              tar -czf /tmp/$BACKUP_NAME -C /tmp mongo_data

            echo "Copying backup to VPS..."
            kubectl cp production/$POD_NAME:/tmp/$BACKUP_NAME ./$BACKUP_NAME

            echo "Cleaning temporary files..."
            kubectl exec -n production $POD_NAME -- \
              rm -rf /tmp/mongo_data /tmp/$BACKUP_NAME

            echo "Backup created: $BACKUP_NAME"

      - name: Find Backup File
        run: |
          BACKUP_NAME=$(ls mongo_backup_*.tar.gz | head -n 1)

          if [ -z "$BACKUP_NAME" ]; then
            echo "Backup file not found!"
            exit 1
          fi

          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV

          echo "Found backup file:"
          ls -lh $BACKUP_NAME

      - name: Upload Backup to Google Drive
        run: |
          rclone copy "./${{ env.BACKUP_NAME }}" gdrive:DB-backup -P

          echo "✅ Uploaded successfully to Google Drive"

      - name: Verify Upload
        run: |
          echo "Files in Google Drive:"
          rclone ls gdrive:DB-backup

      - name: Cleanup Runner
        if: always()
        run: |
          rm -f mongo_backup_*.tar.gz

          echo "✅ Cleanup completed"
