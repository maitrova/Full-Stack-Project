name: Build and Push Docker Images

on:
  push:
    branches: [ deploy-ment ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: maitrova
  BACKEND_IMAGE: maitrova/crud-backend
  FRONTEND_IMAGE: maitrova/crud-frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://maitrova.in/api
            VITE_IMAGE_URL=https://maitrova.in/api
            VITE_GOOGLE_CLIENT_ID=777795975212-0kfni6fgt4036k9rplvf1l7n70hukngo.apps.googleusercontent.com

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Output tags
        run: |
          echo "✅ Images pushed successfully!"
          echo "Backend: ${{ env.BACKEND_IMAGE }}:latest"
          echo "Backend: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:latest"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}"

  deploy_to_vps:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup old Helm charts on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            rm -rf /tmp/backend /tmp/frontend
            echo "✅ Cleaned up old helm charts"

      - name: Copy Helm charts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "helm-charts/backend,helm-charts/frontend"
          target: "/tmp/"
          strip_components: 1

      - name: Deploy Backend and Frontend to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Deploy backend with helm upgrade --install
            helm upgrade --install backend /tmp/backend \
              --namespace production \
              --create-namespace \
              --history-max 3 \
              --set image.tag=${{ needs.build_and_push.outputs.version_tag }} \
              --wait \
              --atomic
            
            echo "✅ Backend deployed successfully with tag ${{ needs.build_and_push.outputs.version_tag }}"
            
            # Deploy frontend with helm upgrade --install
            helm upgrade --install frontend /tmp/frontend \
              --namespace production \
              --create-namespace \
              --history-max 3 \
              --set image.tag=${{ needs.build_and_push.outputs.version_tag }} \
              --wait \
              --atomic
            
            echo "✅ Frontend deployed successfully with tag ${{ needs.build_and_push.outputs.version_tag }}"

