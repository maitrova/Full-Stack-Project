name: Build and Push Docker Images

on:
  push:
    branches: [ deploy-ment ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: maitrova
  BACKEND_IMAGE: maitrova/crud-backend
  FRONTEND_IMAGE: maitrova/crud-frontend

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://maitrova.in/api
            VITE_IMAGE_URL=https://maitrova.in/api
            VITE_GOOGLE_CLIENT_ID=777795975212-0kfni6fgt4036k9rplvf1l7n70hukngo.apps.googleusercontent.com

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Output tags
        run: |
          echo "✅ Images pushed successfully!"
          echo "Backend: ${{ env.BACKEND_IMAGE }}:latest"
          echo "Backend: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:latest"
          echo "Frontend: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}"

  deploy_to_vps:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Helm charts to VPS
        run: |
          scp -r helm-charts/backend ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/
          scp -r helm-charts/frontend ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy Backend to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Delete existing backend release
            helm uninstall backend --namespace production --ignore-not-found
            
            # Install new backend release
            helm install backend /tmp/backend \
              --namespace production \
              --create-namespace \
              --set image.tag=${{ needs.build_and_push.outputs.version_tag }} \
              --wait
            
            echo "✅ Backend deployed successfully with tag ${{ needs.build_and_push.outputs.version_tag }}"
          EOF

      - name: Deploy Frontend to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Delete existing frontend release
            helm uninstall frontend --namespace production --ignore-not-found
            
            # Install new frontend release
            helm install frontend /tmp/frontend \
              --namespace production \
              --create-namespace \
              --set image.tag=${{ needs.build_and_push.outputs.version_tag }} \
              --wait
            
            echo "✅ Frontend deployed successfully with tag ${{ needs.build_and_push.outputs.version_tag }}"
          EOF

      - name: Cleanup temporary files
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            rm -rf /tmp/backend /tmp/frontend
          EOF
