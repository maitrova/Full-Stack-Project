version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: crud-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: crud-app
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - crud-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/crud-app --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crud-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/crud-app
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crud-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: crud-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crud-network

volumes:
  mongodb_data:
    driver: local

networks:
  crud-network:
    driver: bridge
