# Frontend Configuration
name: frontend
fullnameOverride: frontend

replicaCount: 2

image:
  repository: docker.io/maitrova/maitrova
  tag: frontend
  pullPolicy: Always

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Environment Configuration
env: production

# Application Environment Variables
envVars:
  NODE_ENV: production
  # Add any frontend env vars here

# Secret Environment Variables (if frontend needs any)
envSecrets:
  # Add any frontend secrets here
  # EXAMPLE: API_KEY: "your-api-key"

# Resource Limits
resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 256Mi

# Health Checks
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1
