{{- if .Values.envSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.fullname" . }}-secret
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.envSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
