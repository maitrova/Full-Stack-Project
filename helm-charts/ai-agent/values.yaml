name: ai-agent
fullnameOverride: ai-agent

replicaCount: 1

image:
  repository: maitrova/ai-agent
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: maitrova-cert
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  hosts:
    - host: ai.maitrova.in
      paths:
        - path: /api/whatsapp/webhook
          pathType: Exact
        - path: /api/
          pathType: Prefix
  tls:
    - secretName: ai-maitrova-tls
      hosts:
        - ai.maitrova.in

envVars:
  APP_NAME: AI Sales Employee API
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  API_PREFIX: /api
  MONGODB_DB_NAME: appdb
  ECOMMERCE_MONGODB_DB_NAME: appdb
  ECOMMERCE_PUBLIC_URL: https://maitrova.in/api/outputs
  ECOMMERCE_STOREFRONT_URL: https://www.maitrova.in
  ECOMMERCE_CUSTOMIZATION_URL: https://maitrova.in/customproducts
  ECOMMERCE_API_URL: https://maitrova.in/api
  REMOTE_IMAGE_ALLOWED_HOSTS: www.maitrova.in,maitrova.in
  REMOTE_IMAGE_MAX_BYTES: "10485760"
  # Both canonical storefront hosts serve the browser application.
  FRONTEND_ORIGIN: https://www.maitrova.in,https://maitrova.in
  GEMINI_MODEL: gemini-3.1-flash-lite
  OPENAI_MODEL: gpt-4.1-mini
  MERCHANT_PROMPT_VERSION: "2026-10-01"
  # Website chat engine: "rules" or "tools". While on rules, the rollout
  # percentage of browser sessions uses the tool-calling agent.
  WEB_AGENT_MODE: "tools"
  WEB_AGENT_ROLLOUT_PERCENT: "0"
  # WhatsApp engine rollout (see OPERATIONS.md): allowlist -> percentage -> "tools".
  WHATSAPP_AGENT_MODE: "tools"
  WHATSAPP_AGENT_ALLOWLIST: ""
  WHATSAPP_AGENT_ROLLOUT_PERCENT: "0"
  WHATSAPP_HANDOFF_IDLE_HOURS: "12"
  # Set to "order_update" once Meta approves the template.
  WHATSAPP_ORDER_UPDATE_TEMPLATE: ""
  GEMINI_INPUT_COST_PER_MILLION: "0"
  GEMINI_OUTPUT_COST_PER_MILLION: "0"
  OPENAI_INPUT_COST_PER_MILLION: "0"
  OPENAI_OUTPUT_COST_PER_MILLION: "0"
  # Add the exact public pages that contain store policies, FAQs, offers, and customization guidance.
  WEBSITE_KNOWLEDGE_URLS: https://maitrova.in,https://maitrova.in/terms-and-conditions,https://maitrova.in/privacy-policy,https://maitrova.in/faq,https://maitrova.in/about-us,https://maitrova.in/payment-shipping-cancellation-policy,https://maitrova.in/return-refund-policy,https://maitrova.in/customproducts,https://maitrova.in/customization-disclaimer-policy
  WEBSITE_KNOWLEDGE_SYNC_INTERVAL_SECONDS: "900"
  AI_EVALUATION_RATE_LIMIT_PER_MINUTE: "20"
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  WHATSAPP_GRAPH_API_VERSION: v25.0
  WHATSAPP_MESSAGES_PER_MINUTE: "30"
  WHATSAPP_CHECKOUT_LINKS_PER_HOUR: "10"
  WHATSAPP_DEFAULT_LANGUAGE: Roman Telugu

# Reuse the backend's MongoDB URI and appdb database so the ecommerce server
# and AI agent share one database while keeping data in separate collections.
databaseSecret:
  name: backend-secret
  key: MONGOOSE_URL

# Prefer an externally managed Kubernetes Secret in production. When this is
# set, envSecrets below are ignored and no Secret containing values.yaml data
# is rendered by this chart.
existingSecret: ""

# Non-provider secrets are rendered into the ai-agent Secret.
# GEMINI_API_KEY is supplied by the deploy workflow from GitHub Actions secrets.
envSecrets:
  AI_EVALUATION_KEY: ""
  WHATSAPP_VERIFY_TOKEN: "9d80f52f11e34589949dc7ab6c1df33a"
  WHATSAPP_ACCESS_TOKEN: "EAAtOYebWxSoBSzhHJQnIGrpgVGaN8MaZAkShQZBsHipMZBmHlS6wUKR0y1MyBu9L4XZBtb8yiwCSERvHMkqZCW8J4y0X62OUdkaKhrKYut7yOvlVOHAFtqQDu7ZC7VgwLOHfee0PLFBDzXGeT9amJ9JrIiDOH1rlTqrkkJrLmhgyilZCkZB59qUO2hdM0ydXp4ZBZAhgZDZD"
  WHATSAPP_APP_SECRET: "6d9c3a848d0ac061b4fab5fb974acad8"
  # WHATSAPP_COMMERCE_KEY is supplied by the deploy workflow (GitHub secret), shared with the backend.
  WHATSAPP_PHONE_NUMBER_ID: "1412322025299340"
  WHATSAPP_BUSINESS_ID: "6a8ed71fad2e678319a99958"
  WHATSAPP_WABA_ID: "1877727133073102"

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "250m"
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /api/health
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /api/health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1
