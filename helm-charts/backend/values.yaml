# Backend Configuration
name: backend
fullnameOverride: backend

replicaCount: 1

image:
  repository: docker.io/maitrova/maitrova
  tag: backend
  pullPolicy: Always

# Service Configuration
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

# Environment Configuration
env: production

# Application Environment Variables
envVars:
  APP_ENV: production
  PORT: "5000"
  NODE_ENV: production

# Secret Environment Variables (manage all secrets here)
envSecrets:
  JWT_SECRET: "maitrova"  # Change this in production!
  MONGOOSE_PASSWORD: "Saigollapalli@122"
  MONGOOSE_URL: "mongodb://maitrova:Saigollapalli%40122@mongodb:27017/appdb?authSource=admin"

# Resource Limits
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "250m"
    memory: 512Mi

# Health Checks
livenessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /api/health
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# Persistent Storage Configuration (for logs, uploads, temp files, etc.)
persistence:
  enabled: true
  storageClass: "local-path"  # K3s default StorageClass
  accessMode: ReadWriteMany  # Multiple backend pods can share the same volume
  size: 5Gi
  hostPath: /home/sai/backend_data  # Shared storage for all backend pods
  mountPath: /app/data  # Where to mount inside the container
