# NOTE: This secret is optional and not used.
# All secrets are now injected directly as environment variables from values.yaml
# See deployment.yaml env section with envSecrets loop
{{- if false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.envSecrets }}
  {{ $key | lower }}: {{ $value | quote }}
  {{- end }}
{{- end }}
