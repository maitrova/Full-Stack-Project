# Docker Registry Secret for pulling private images
# 
# USAGE:
# 1. Update the credentials below
# 2. Apply once to your cluster: kubectl apply -f docker-registry-secret.yaml -n production
# 3. This secret will be referenced by backend and frontend deployments
#
# NOTE: This is NOT a Helm chart - it's a standalone Kubernetes secret that lives outside Helm

apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
  namespace: production
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config JSON
  # Generate this with:
  # kubectl create secret docker-registry docker-registry-secret \
  #   --docker-server=https://index.docker.io/v1/ \
  #   --docker-username=YOUR_DOCKERHUB_USERNAME \
  #   --docker-password=YOUR_DOCKERHUB_PASSWORD \
  #   --docker-email=YOUR_EMAIL \
  #   --dry-run=client -o yaml
  #
  # Then copy the .dockerconfigjson value here
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJtYWl0cm92YSIsInBhc3N3b3JkIjoiU2FpZ29sbGFwYWxsaUAxMjIiLCJlbWFpbCI6Im1haXRyb3ZhdnBzQGdtYWlsLmNvbSIsImF1dGgiOiJiV0ZwZEhKdmRtRTZVMkZwWjI5c2JHRndZV3hzYVVBeE1qST0ifX19

---
# Alternative: Create the secret imperatively (recommended)
# Run this command on your K3s cluster:
